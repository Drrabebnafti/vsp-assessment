
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VSP Assessment</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>VSP Assessment</h1>

        <p class="subtitle">

            Discover your Top 5 Values,
            Strengths and Passions.

        </p>

        <form id="userForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <button type="submit">

                Start Assessment →

            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
